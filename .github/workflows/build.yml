# Builds the three binary packages of the Modernized Edition: one for Win32
# (x86), one for x64 and one for ARM64.  Each package carries both cores of
# the emulator - the V8 core and the V7 core - together with the libraries
# they load at run time.
#
# The two cores are built by two solution configurations, Release and
# V7Release, and each one lands in its own output directory: win32\x86\
# <configuration>, win32\x64\<configuration> and win32\arm64\<configuration>.
# win32\defaultconfig\Package.ps1 collects them into the archive.
#
# The ARM64 package is built on an ARM64 runner, so it is a native build and
# not a cross compile.
#
# A tag publishes the three packages as the assets of a GitHub release; a
# push of a branch or a pull request only uploads them as workflow artifacts.

name: build

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  win32:
    name: Win32 (x86)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $msbuild = & win32\defaultconfig\FindMSBuild.ps1
          Write-Host "Using $msbuild"
          "path=$msbuild" >> $env:GITHUB_OUTPUT

      - name: Build the V8 core
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.path }}" win32\VBA_Latest.sln /m /nologo /v:minimal `
            /p:Configuration=Release /p:Platform=Win32

      - name: Build the V7 core
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.path }}" win32\VBA_Latest.sln /m /nologo /v:minimal `
            /p:Configuration=V7Release /p:Platform=Win32

      - name: Package
        shell: pwsh
        run: |
          pwsh -File win32\defaultconfig\Package.ps1 -Platform Win32 -OutputDir package

      - uses: actions/upload-artifact@v4
        with:
          name: vba-rerecording-win32
          path: package\*.zip
          if-no-files-found: error

  x64:
    name: x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $msbuild = & win32\defaultconfig\FindMSBuild.ps1
          Write-Host "Using $msbuild"
          "path=$msbuild" >> $env:GITHUB_OUTPUT

      - name: Build the V8 core
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.path }}" win32\VBA_Latest.sln /m /nologo /v:minimal `
            /p:Configuration=Release /p:Platform=x64

      - name: Build the V7 core
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.path }}" win32\VBA_Latest.sln /m /nologo /v:minimal `
            /p:Configuration=V7Release /p:Platform=x64

      - name: Package
        shell: pwsh
        run: |
          pwsh -File win32\defaultconfig\Package.ps1 -Platform x64 -OutputDir package

      - uses: actions/upload-artifact@v4
        with:
          name: vba-rerecording-x64
          path: package\*.zip
          if-no-files-found: error

  arm64:
    name: ARM64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $msbuild = & win32\defaultconfig\FindMSBuild.ps1
          Write-Host "Using $msbuild"
          "path=$msbuild" >> $env:GITHUB_OUTPUT

      - name: Build the V8 core
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.path }}" win32\VBA_Latest.sln /m /nologo /v:minimal `
            /p:Configuration=Release /p:Platform=ARM64

      - name: Build the V7 core
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.path }}" win32\VBA_Latest.sln /m /nologo /v:minimal `
            /p:Configuration=V7Release /p:Platform=ARM64

      - name: Package
        shell: pwsh
        run: |
          pwsh -File win32\defaultconfig\Package.ps1 -Platform ARM64 -OutputDir package

      - uses: actions/upload-artifact@v4
        with:
          name: vba-rerecording-arm64
          path: package\*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [win32, x64, arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "VBA-rr ${{ github.ref_name }}" \
            --generate-notes \
            packages/*/*.zip
